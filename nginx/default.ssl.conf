# Config HTTPS active (copiée vers default.conf par scripts/init-letsencrypt.sh)

# --- Redirections HTTP → HTTPS ---
server {
    listen 80;
    server_name dkhometech.sn www.dkhometech.sn api.dkhometech.sn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Site public HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name dkhometech.sn www.dkhometech.sn;

    ssl_certificate     /etc/letsencrypt/live/dkhometech.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dkhometech.sn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- API HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.dkhometech.sn;

    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/dkhometech.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dkhometech.sn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
